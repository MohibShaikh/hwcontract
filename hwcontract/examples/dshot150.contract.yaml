# DShot150: the slowest DShot ESC protocol. Bit period 6.67us, T1H 5.00us (75%),
# T0H 2.50us (37.5%). Each low is judged against the bit whose high it follows.
# Times are nanoseconds.
contract: dshot150
headroom_pct: 15
edges:
  - {name: T0H, min: 2250, typ: 2500, max: 2750}   # '0' bit high
  - {name: T1H, min: 4500, typ: 5000, max: 5500}   # '1' bit high
  - {name: T0L, min: 3750, typ: 4167, max: 4583}   # '0' bit low (period - T0H)
  - {name: T1L, min: 1500, typ: 1667, max: 1833}   # '1' bit low (period - T1H)
  # not a spec value: a low longer than one bit period ends the frame. Explains
  # the gaps between frames when a capture has them; never required.
  - {name: FRAME_GAP, measure: low, min: 6667, typ: 6667, max: null, required: false}
