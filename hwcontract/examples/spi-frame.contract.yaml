# Cross-event temporal contract: SPI framing on raw pin edges (edges.py, or
# any decoder that emits pin transitions). Catches ordering faults a loopback
# test cannot see -- e.g. Zephyr #110302, where CS asserted after SCK started
# and MOSI setup time collapsed only for certain data. Active-low CS: falling
# = asserted. Selector grammar: last dotted component is the event type, the
# rest is the source, a field=value tail filters fields; "*" matches any type
# of the source. Times are nanoseconds.
contract: spi-frame
kind: events
assertions:
  - name: cs-precedes-first-clock
    when: spi.sck.rising             # each rising SCK edge
    require: gpio.cs.falling         # CS must already be asserted...
    within: [-10us, 0ns]             # ...sometime before the edge (negative = look back)
  - name: mosi-setup
    when: spi.sck.rising
    forbid: spi.mosi.*               # no MOSI transition at all...
    before: 20ns                     # ...in the 20ns before the sampling edge
  - name: cs-frame-width
    when: gpio.cs.falling            # CS asserted...
    require: gpio.cs.rising          # ...and released again
    within: [4us, 30us]              # frame occupies 4..30us of wire time
