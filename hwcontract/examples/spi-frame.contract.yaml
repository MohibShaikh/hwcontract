# Cross-event temporal contract: SPI framing on decoded events (sigrok
# jsontrace, or any normalized event list). Catches ordering faults a
# loopback test cannot see -- e.g. Zephyr #110302, where CS asserted after
# SCK started and MOSI setup time collapsed only for certain data.
# Selectors: last dotted component is the event type, the rest the source,
# a field=value tail filters on event fields. Times are nanoseconds.
contract: spi-frame
kind: events
assertions:
  - name: cs-precedes-first-clock
    when: spi0.clock_edge.value=1    # each sampling edge
    require: gpio.cs.value=0         # chip-select must already be asserted...
    within: [-10us, 0ns]             # ...sometime before the edge (negative = look back)
  - name: cs-before-first-clock
    when: gpio.cs.value=0            # chip-select asserts
    require: spi0.clock_edge         # a clock edge must follow...
    within: [80ns, 2us]              # ...inside the setup window
  - name: no-clock-outside-frame
    forbid: spi0.clock_edge          # no clocking...
    while: gpio.cs.value=1           # ...while the frame is deselected
  - name: mosi-setup
    when: spi0.clock_edge.value=1    # each sampling edge
    forbid: gpio.change              # MOSI transitions (source gpio, type change)
    before: 20ns                     # MOSI must be stable the 20ns before
