# WS2813 / WS2813B: the "addressable + backup data line" variant of the WS2812
# family. Bit timing from the WS2813B datasheet: '0' and '1' are told apart by
# the HIGH pulse, the LOW is identical for both: one TL edge covers it, 580-1000ns
# (typ is the midpoint; the datasheet gives a range). Times are nanoseconds.
contract: ws2813
headroom_pct: 20
edges:
  - {name: T0H,   min: 220,   typ: 300,   max: 380}    # '0' bit, high time
  - {name: T1H,   min: 580,   typ: 800,   max: 1000}   # '1' bit, high time
  - {name: RESET, min: 280000, typ: 280000, max: null} # >280us resets the strip
  - {name: TL,    measure: low, min: 580, typ: 790, max: 1000}   # either bit's low
