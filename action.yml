name: "hwcontract"
description: "Judge hardware captures against hwcontract contracts in CI. A FAIL, MARGINAL or MISSING edge fails the step with the verdict table and GitHub error annotations."
branding:
  icon: "activity"
  color: "green"

inputs:
  timing:
    description: >-
      Timing checks as contract=capture-glob pairs, newline or comma separated.
      Captures are CSVs of 0/1 samples, one per line (sigrok_adapter --csv format).
      Contract is a path or a bundled name (ws2812b, dshot600, sk6812, ...).
    required: false
  serial:
    description: >-
      Serial checks as contract=log-glob pairs, same syntax. Logs are plain text
      judged against the contract's expect/forbid regexes.
    required: false
  events:
    description: >-
      Event checks as contract=trace-glob pairs, same syntax. Traces are JSON:
      sigrok-cli --protocol-decoder-jsontrace output or a bare event list.
    required: false
  samplerate:
    description: "Samplerate of the CSV captures in Hz"
    default: "24000000"
  junit:
    description: "Write a JUnit XML report to this path (shows in GitHub's tests tab)"
    default: ""
  evidence:
    description: "Write an evidence JSON (contract + input hashes per check) to this path"
    default: ""

outputs:
  verdict:
    description: "PASS or FAIL"
    value: ${{ steps.check.outputs.verdict }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install --quiet "hwcontract==0.4.2"
      shell: bash
    - id: check
      env:
        INPUT_TIMING: ${{ inputs.timing }}
        INPUT_SERIAL: ${{ inputs.serial }}
        INPUT_EVENTS: ${{ inputs.events }}
        INPUT_SAMPLERATE: ${{ inputs.samplerate }}
        INPUT_JUNIT: ${{ inputs.junit }}
        INPUT_EVIDENCE: ${{ inputs.evidence }}
      run: |
        set +e
        python "$GITHUB_ACTION_PATH/action/check.py"
        code=$?
        echo "verdict=$([ "$code" -eq 0 ] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
        exit $code
      shell: bash
